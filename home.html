<!DOCTYPE html>
<html>
<head>
<title>Tamdeen Group</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(180deg,#0b0f14,#111827);
color:white;
text-align:center;
}

h1{
margin-top:40px;
color:#ff4d4d;
}

.sub{
color:#aaa;
margin-bottom:20px;
}

.card{
margin:15px auto;
width:80%;
max-width:320px;
padding:20px;
background:#1f2937;
border-radius:12px;
font-size:18px;
cursor:pointer;
transition:0.2s;
user-select:none;
}

.card:hover{
background:#374151;
transform:scale(1.03);
}
</style>
</head>

<body>

<h1>🔥 Tamdeen Group</h1>
<div class="sub">Fire & Safety Management System</div>

<div class="card" onclick="goMall('360 Mall')">360 Mall</div>
<div class="card" onclick="goMall('Khiran Mall')">Khiran Mall</div>
<div class="card" onclick="goMall('Alkout Mall')">Alkout Mall</div>

<script>
function goMall(mall){

// store selected mall
localStorage.setItem("mall", mall);

// debug log (check console if needed)
console.log("Opening mall:", mall);

// force navigation (MOST RELIABLE METHOD)
setTimeout(() => {
window.location.href = "./system.html";
}, 100);
}
</script>

</body>
</html>
