<!DOCTYPE html>
<html>
<head>
<title>Tamdeen Group</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(180deg,#0b0f14,#111827);
color:white;
text-align:center;
}

h1{
margin-top:30px;
color:#ff4d4d;
}

.card{
margin:15px auto;
width:80%;
padding:20px;
background:#1f2937;
border-radius:10px;
font-size:20px;
cursor:pointer;
transition:0.3s;
}

.card:hover{
background:#374151;
transform:scale(1.03);
}
</style>
</head>

<body>

<h1>🔥 Tamdeen Group</h1>

<div class="card" onclick="openMall('360 Mall')">360 Mall</div>
<div class="card" onclick="openMall('Khiran Mall')">Khiran Mall</div>
<div class="card" onclick="openMall('Alkout Mall')">Alkout Mall</div>

<script>
function openMall(mall){
localStorage.setItem("mall",mall);
window.location="system.html";
}
</script>

</body>
</html>
