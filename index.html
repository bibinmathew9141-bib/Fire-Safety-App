<!DOCTYPE html>
<html>
<head>
<title>Fire Safety Login</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: radial-gradient(#2b0000, #000);
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.box {
  background: #111;
  padding: 30px;
  border-radius: 10px;
  width: 300px;
  box-shadow: 0 0 20px red;
  text-align: center;
}

input {
  width: 100%;
  padding: 10px;
  margin: 8px 0;
  border: none;
  outline: none;
}

button {
  width: 100%;
  padding: 10px;
  background: red;
  color: white;
  border: none;
  cursor: pointer;
}

.error {
  color: orange;
  margin-top: 10px;
}

h2 {
  color: red;
}

.footer {
  margin-top: 10px;
  font-size: 12px;
  color: gray;
}
</style>
</head>

<body>

<div class="box">
  <h2>🔥 Fire Safety Login</h2>

  <input id="user" placeholder="User ID">
  <input id="pass" type="password" placeholder="Password">

  <button onclick="login()">Login</button>

  <div id="msg" class="error"></div>

  <div class="footer">Made by Bibin</div>
</div>

<script>

function login() {

  let u = document.getElementById("user").value;
  let p = document.getElementById("pass").value;
  let msg = document.getElementById("msg");

  if (u !== "Tamdeen") {
    msg.innerText = "❌ Wrong Username";
    return;
  }

  if (p !== "T@mdeen123") {
    msg.innerText = "❌ Wrong Password";
    return;
  }

  localStorage.setItem("user", u);

  window.location.href = "dashboard.html";
}

</script>

</body>
</html>
