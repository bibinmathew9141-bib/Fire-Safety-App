<!DOCTYPE html>
<html>
<head>
<title>Tamdeen Group</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
font-family:Arial;
background:#0b0f14;
color:white;
text-align:center;
}

h1{
margin-top:20px;
}

.card{
background:#1f2937;
margin:15px;
padding:20px;
border-radius:10px;
cursor:pointer;
font-size:18px;
}

.card:hover{
background:#374151;
}
</style>
</head>

<body>

<h1>Tamdeen Group</h1>

<div class="card" onclick="openMall('360 Mall')">360 Mall</div>
<div class="card" onclick="openMall('Khiran Mall')">Khiran Mall</div>
<div class="card" onclick="openMall('Alkout Mall')">Alkout Mall</div>

<script>
function openMall(mall){
localStorage.setItem("mall",mall);
window.location="system.html";
}
</script>

</body>
</html>
