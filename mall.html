<!DOCTYPE html>
<html>
<head>
  <title>Mall Systems</title>

  <style>
    body {
      font-family: Arial;
      background: black;
      color: white;
      text-align: center;
    }

    h1 {
      color: red;
    }

    button {
      display: block;
      width: 80%;
      margin: 10px auto;
      padding: 15px;
      background: red;
      color: white;
      border: none;
      font-size: 16px;
    }
  </style>
</head>

<body>

<h1 id="mallName"></h1>

<button onclick="openSystem('Fire Alarm Panels')">Fire Alarm Panels</button>
<button onclick="openSystem('Fire Pumps')">Fire Pumps</button>
<button onclick="openSystem('Fire Water Tank')">Fire Water Tank</button>
<button onclick="openSystem('FM200 Data Room')">FM/200 Data Room</button>
<button onclick="openSystem('Foam System / Generator')">Foam System / Generator</button>
<button onclick="openSystem('Substation LT/HT')">Substation (LT/HT)</button>
<button onclick="openSystem('Gas Chamber Tank')">Gas Chamber / Tank</button>
<button onclick="openSystem('Deluge System')">Deluge System</button>
<button onclick="openSystem('Fit Outs')">Fit-outs</button>
<button onclick="openSystem('Inspections')">Inspection</button>
<button onclick="openSystem('Daily Visit')">Daily Visit</button>
<button onclick="openSystem('Additional Jobs')">Additional Assign Jobs</button>

<script>
let mall = localStorage.getItem("mall");
document.getElementById("mallName").innerText = "🔥 " + mall + " Mall";

function openSystem(system) {
  localStorage.setItem("system", system);
  window.location.href = "system.html";
}
</script>

</body>
</html>
