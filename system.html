<!DOCTYPE html>
<html>
<head>
  <title>Fire Safety System</title>

  <style>
    body {
      font-family: Arial;
      background: black;
      color: white;
      text-align: center;
    }

    h2 {
      color: red;
    }

    button {
      margin: 5px;
      padding: 10px;
      background: red;
      color: white;
      border: none;
      cursor: pointer;
    }

    input {
      padding: 8px;
      margin: 5px;
      width: 80%;
    }

    .tab {
      display: none;
    }

    .active {
      display: block;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      color: black;
      margin-top: 10px;
    }

    th, td {
      border: 1px solid black;
      padding: 8px;
    }
  </style>
</head>

<body>

<h2 id="title"></h2>

<button onclick="showTab('daily')">Daily Sheet</button>
<button onclick="showTab('monthly')">Monthly</button>
<button onclick="showTab('yearly')">Yearly</button>

<div id="daily" class="tab active">

  <h3>Daily Entry</h3>

  <input id="tag" placeholder="Tag No / Name"><br>
  <input id="location" placeholder="Location"><br>
  <input id="status" placeholder="Status"><br>
  <input id="remarks" placeholder="Remarks"><br>
  <input id="shift" placeholder="Shift"><br>

  <button onclick="addRow()">➕ Add Row</button>

  <table id="table">
    <tr>
      <th>Sl No</th>
      <th>Date</th>
      <th>Tag</th>
      <th>Location</th>
      <th>Status</th>
      <th>Remarks</th>
      <th>Shift</th>
    </tr>
  </table>

</div>

<div id="monthly" class="tab">
  <h3>Monthly Sheet (Next Step)</h3>
</div>

<div id="yearly" class="tab">
  <h3>Yearly Sheet (Next Step)</h3>
</div>

<script>

// TITLE
let mall = localStorage.getItem("mall") || "Mall";
let system = localStorage.getItem("system") || "System";

document.getElementById("title").innerText =
  mall + " - " + system;

// LOAD SAVED DATA
let records = JSON.parse(localStorage.getItem("records")) || [];

// SHOW TABLE
function renderTable() {

  let table = document.getElementById("table");

  table.innerHTML = `
    <tr>
      <th>Sl No</th>
      <th>Date</th>
      <th>Tag</th>
      <th>Location</th>
      <th>Status</th>
      <th>Remarks</th>
      <th>Shift</th>
    </tr>
  `;

  records.forEach((d, i) => {

    let row = table.insertRow();

    row.innerHTML = `
      <td>${i + 1}</td>
      <td>${d.date}</td>
      <td>${d.tag}</td>
      <td>${d.location}</td>
      <td>${d.status}</td>
      <td>${d.remarks}</td>
      <td>${d.shift}</td>
    `;
  });
}

// INITIAL LOAD
renderTable();

// ADD ROW
function addRow() {

  let tag = document.getElementById("tag").value;
  let location = document.getElementById("location").value;
  let status = document.getElementById("status").value;
  let remarks = document.getElementById("remarks").value;
  let shift = document.getElementById("shift").value;

  if (!tag || !location || !status) {
    alert("Please fill Tag, Location, Status");
    return;
  }

  let data = {
    date: new Date().toISOString().split('T')[0],
    tag: tag,
    location: location,
    status: status,
    remarks: remarks,
    shift: shift
  };

  records.push(data);

  localStorage.setItem("records", JSON.stringify(records));

  renderTable();

  // clear inputs
  document.getElementById("tag").value = "";
  document.getElementById("location").value = "";
  document.getElementById("status").value = "";
  document.getElementById("remarks").value = "";
  document.getElementById("shift").value = "";
}

// TABS
function showTab(tab) {

  document.getElementById("daily").classList.remove("active");
  document.getElementById("monthly").classList.remove("active");
  document.getElementById("yearly").classList.remove("active");

  document.getElementById(tab).classList.add("active");
}

</script>

</body>
</html>
