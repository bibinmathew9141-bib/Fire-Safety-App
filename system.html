<!DOCTYPE html>
<html>
<head>
  <title>Fire Safety System</title>

  <style>
    body {
      font-family: Arial;
      background: black;
      color: white;
      text-align: center;
    }

    h2 {
      color: red;
    }

    button {
      margin: 5px;
      padding: 10px;
      background: red;
      color: white;
      border: none;
      cursor: pointer;
    }

    .tab {
      display: none;
    }

    .active {
      display: block;
    }

    table {
      width: 100%;
      background: white;
      color: black;
      border-collapse: collapse;
    }

    th, td {
      border: 1px solid black;
      padding: 8px;
    }
  </style>
</head>

<body>

<h2 id="title"></h2>

<button onclick="showTab('daily')">Daily Sheet</button>
<button onclick="showTab('monthly')">Monthly</button>
<button onclick="showTab('yearly')">Yearly</button>

<div id="daily" class="tab active">

  <button onclick="addRow()">➕ Add Row</button>

  <table id="table">
    <tr>
      <th>Sl No</th>
      <th>Date</th>
      <th>Tag</th>
      <th>Location</th>
      <th>Status</th>
      <th>Remarks</th>
      <th>Shift</th>
    </tr>
  </table>

</div>

<div id="monthly" class="tab">
  <h3>Monthly Sheet (Next Step)</h3>
</div>

<div id="yearly" class="tab">
  <h3>Yearly Sheet (Next Step)</h3>
</div>

<script>

// SAFE TITLE
let mall = localStorage.getItem("mall") || "Mall";
let system = localStorage.getItem("system") || "System";

document.getElementById("title").innerText =
  mall + " - " + system;

// TABS
function showTab(tab) {
  document.getElementById("daily").classList.remove("active");
  document.getElementById("monthly").classList.remove("active");
  document.getElementById("yearly").classList.remove("active");

  document.getElementById(tab).classList.add("active");
}

// TEST ADD ROW (NO FIREBASE YET)
function addRow() {

  let table = document.getElementById("table");

  let row = table.insertRow();

  row.innerHTML = `
    <td>${table.rows.length}</td>
    <td>${new Date().toISOString().split('T')[0]}</td>
    <td>Test Tag</td>
    <td>Test Location</td>
    <td>OK</td>
    <td>Working</td>
    <td>Day</td>
  `;

}

</script>

</body>
</html>
