<!DOCTYPE html>
<html>
<head>
<title>System</title>

<style>
body {
  background: #000;
  color: white;
  font-family: Arial;
  text-align: center;
}

h2 { color: red; }

button {
  padding: 10px;
  margin: 5px;
  background: red;
  color: white;
  border: none;
}
</style>
</head>

<body>

<h2 id="title"></h2>

<button onclick="help()">❓ Help</button>

<div id="helpBox"></div>

<script>

let mall = localStorage.getItem("mall");
document.getElementById("title").innerText = mall;

function help() {
  document.getElementById("helpBox").innerHTML = `
    <h3>How to Use</h3>
    <p>1. Select system module</p>
    <p>2. Add daily inspection data</p>
    <p>3. View monthly/yearly reports</p>
    <p>Made by Bibin</p>
  `;
}

</script>

</body>
</html>
