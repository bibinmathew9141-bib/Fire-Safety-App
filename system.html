<!DOCTYPE html>
<html>
<head>
<title>Fire Safety System</title>

<style>
body {
  font-family: Arial;
  background: #000;
  color: white;
  text-align: center;
}

h2 { color: red; }

input, select {
  padding: 8px;
  margin: 5px;
  width: 80%;
}

button {
  padding: 8px;
  margin: 3px;
  background: red;
  color: white;
  border: none;
  cursor: pointer;
}

table {
  width: 100%;
  margin-top: 10px;
  border-collapse: collapse;
  background: white;
  color: black;
}

th, td {
  border: 1px solid black;
  padding: 6px;
}

.filterBox {
  margin: 10px;
}
</style>
</head>

<body>

<h2 id="title"></h2>

<!-- FILTER -->
<div class="filterBox">
  <input id="search" placeholder="Search Tag / Location">
  <select id="statusFilter">
    <option value="">All Status</option>
    <option value="OK">OK</option>
    <option value="Fault">Fault</option>
    <option value="Maintenance">Maintenance</option>
  </select>

  <button onclick="render()">Filter</button>
</div>

<!-- INPUT FORM -->
<div>
  <input id="tag" placeholder="Tag No">
  <input id="location" placeholder="Location">
  <input id="status" placeholder="Status (OK/Fault/Maintenance)">
  <input id="remarks" placeholder="Remarks">
  <input id="shift" placeholder="Shift">

  <button onclick="addRow()">Add Row</button>
</div>

<!-- TABLE -->
<table>
  <thead>
    <tr>
      <th>Date</th>
      <th>Tag</th>
      <th>Location</th>
      <th>Status</th>
      <th>Remarks</th>
      <th>Shift</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody id="table"></tbody>
</table>

<script>

let mall = localStorage.getItem("mall") || "Mall";
document.getElementById("title").innerText = "🔥 " + mall + " System";

let data = JSON.parse(localStorage.getItem("fireData")) || [];

let editIndex = -1;

// SAVE
function save() {
  localStorage.setItem("fireData", JSON.stringify(data));
}

// ADD
function addRow() {

  let tag = document.getElementById("tag").value;
  let location = document.getElementById("location").value;
  let status = document.getElementById("status").value;
  let remarks = document.getElementById("remarks").value;
  let shift = document.getElementById("shift").value;

  if (!tag || !location || !status) {
    alert("Fill required fields");
    return;
  }

  let obj = {
    date: new Date().toLocaleDateString(),
    tag,
    location,
    status,
    remarks,
    shift
  };

  if (editIndex === -1) {
    data.push(obj);
  } else {
    data[editIndex] = obj;
    editIndex = -1;
  }

  save();
  clear();
  render();
}

// CLEAR
function clear() {
  document.getElementById("tag").value = "";
  document.getElementById("location").value = "";
  document.getElementById("status").value = "";
  document.getElementById("remarks").value = "";
  document.getElementById("shift").value = "";
}

// EDIT
function edit(i) {
  let d = data[i];

  document.getElementById("tag").value = d.tag;
  document.getElementById("location").value = d.location;
  document.getElementById("status").value = d.status;
  document.getElementById("remarks").value = d.remarks;
  document.getElementById("shift").value = d.shift;

  editIndex = i;
}

// DELETE
function del(i) {
  data.splice(i, 1);
  save();
  render();
}

// FILTER + RENDER
function render() {

  let search = document.getElementById("search").value.toLowerCase();
  let statusFilter = document.getElementById("statusFilter").value;

  let table = document.getElementById("table");
  table.innerHTML = "";

  data.forEach((d, i) => {

    if (
      (search && !d.tag.toLowerCase().includes(search) &&
      !d.location.toLowerCase().includes(search)) ||
      (statusFilter && d.status !== statusFilter)
    ) return;

    table.innerHTML += `
      <tr>
        <td>${d.date}</td>
        <td>${d.tag}</td>
        <td>${d.location}</td>
        <td>${d.status}</td>
        <td>${d.remarks}</td>
        <td>${d.shift}</td>
        <td>
          <button onclick="edit(${i})">Edit</button>
          <button onclick="del(${i})">Delete</button>
        </td>
      </tr>
    `;
  });
}

render();

</script>

</body>
</html>
