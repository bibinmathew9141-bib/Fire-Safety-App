<!DOCTYPE html>
<html>
<head>
  <title>Fire Safety System</title>

  <style>
    body {
      font-family: Arial;
      background: black;
      color: white;
      text-align: center;
    }

    h2 { color: red; }

    button {
      margin: 5px;
      padding: 10px;
      background: red;
      color: white;
      border: none;
      cursor: pointer;
    }

    input {
      padding: 8px;
      margin: 5px;
      width: 80%;
    }

    .tab { display: none; }
    .active { display: block; }

    table {
      width: 100%;
      background: white;
      color: black;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      border: 1px solid black;
      padding: 8px;
    }
  </style>
</head>

<body>

<h2 id="title"></h2>

<button onclick="showTab('daily')">Daily Sheet</button>
<button onclick="showTab('monthly')">Monthly Sheet</button>
<button onclick="showTab('yearly')">Yearly Sheet</button>

<!-- DAILY -->
<div id="daily" class="tab active">

  <input id="tag" placeholder="Tag No"><br>
  <input id="location" placeholder="Location"><br>
  <input id="status" placeholder="Status"><br>
  <input id="remarks" placeholder="Remarks"><br>
  <input id="shift" placeholder="Shift"><br>

  <button onclick="addRow()">➕ Add Row</button>

  <table id="dailyTable">
    <tr>
      <th>Sl No</th>
      <th>Date</th>
      <th>Tag</th>
      <th>Location</th>
      <th>Status</th>
      <th>Remarks</th>
      <th>Shift</th>
    </tr>
  </table>

</div>

<!-- MONTHLY -->
<div id="monthly" class="tab">
  <h3>Monthly Reports</h3>
  <div id="monthlyList"></div>
</div>

<!-- YEARLY -->
<div id="yearly" class="tab">
  <h3>Yearly Reports</h3>
  <div id="yearlyList"></div>
</div>

<script>

// TITLE
let mall = localStorage.getItem("mall") || "Mall";
let system = localStorage.getItem("system") || "System";

document.getElementById("title").innerText =
  mall + " - " + system;

// LOAD DATA
let records = JSON.parse(localStorage.getItem("records")) || [];

// SAVE FUNCTION
function saveData() {
  localStorage.setItem("records", JSON.stringify(records));
}

// ADD ROW
function addRow() {

  let tag = document.getElementById("tag").value;
  let location = document.getElementById("location").value;
  let status = document.getElementById("status").value;
  let remarks = document.getElementById("remarks").value;
  let shift = document.getElementById("shift").value;

  if (!tag || !location || !status) {
    alert("Fill required fields");
    return;
  }

  let dateObj = new Date();
  let date = dateObj.toISOString().split('T')[0];
  let monthKey = dateObj.getFullYear() + "-" + (dateObj.getMonth()+1);
  let yearKey = dateObj.getFullYear();

  records.push({
    date,
    monthKey,
    yearKey,
    tag,
    location,
    status,
    remarks,
    shift
  });

  saveData();

  renderAll();

  // clear
  document.getElementById("tag").value = "";
  document.getElementById("location").value = "";
  document.getElementById("status").value = "";
  document.getElementById("remarks").value = "";
  document.getElementById("shift").value = "";
}

// RENDER DAILY
function renderDaily() {

  let table = document.getElementById("dailyTable");

  table.innerHTML = `
    <tr>
      <th>Sl No</th>
      <th>Date</th>
      <th>Tag</th>
      <th>Location</th>
      <th>Status</th>
      <th>Remarks</th>
      <th>Shift</th>
    </tr>
  `;

  records.forEach((d, i) => {
    let row = table.insertRow();
    row.innerHTML = `
      <td>${i+1}</td>
      <td>${d.date}</td>
      <td>${d.tag}</td>
      <td>${d.location}</td>
      <td>${d.status}</td>
      <td>${d.remarks}</td>
      <td>${d.shift}</td>
    `;
  });
}

// RENDER MONTHLY
function renderMonthly() {

  let div = document.getElementById("monthlyList");

  let months = {};

  records.forEach(r => {
    if (!months[r.monthKey]) months[r.monthKey] = [];
    months[r.monthKey].push(r);
  });

  div.innerHTML = "";

  Object.keys(months).forEach(m => {
    div.innerHTML += <h4>${m}</h4>;
  });
}

// RENDER YEARLY
function renderYearly() {

  let div = document.getElementById("yearlyList");

  let years = {};

  records.forEach(r => {
    if (!years[r.yearKey]) years[r.yearKey] = [];
    years[r.yearKey].push(r);
  });

  div.innerHTML = "";

  Object.keys(years).forEach(y => {
    div.innerHTML += <h4>${y}</h4>;
  });
}

// RENDER ALL
function renderAll() {
  renderDaily();
  renderMonthly();
  renderYearly();
}

// TABS
function showTab(tab) {
  document.getElementById("daily").classList.remove("active");
  document.getElementById("monthly").classList.remove("active");
  document.getElementById("yearly").classList.remove("active");

  document.getElementById(tab).classList.add("active");
}

// INIT
renderAll();

</script>

</body>
</html>
