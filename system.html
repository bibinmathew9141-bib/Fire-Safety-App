<!DOCTYPE html>
<html>
<head>
  <title>System Data</title>

  <style>
    body {
      font-family: Arial;
      background: black;
      color: white;
      text-align: center;
    }

    h2 {
      color: red;
    }

    button {
      margin: 5px;
      padding: 10px;
      background: red;
      color: white;
      border: none;
      cursor: pointer;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background: white;
      color: black;
    }

    th, td {
      border: 1px solid black;
      padding: 8px;
    }
  </style>
</head>

<body>

<h2 id="title"></h2>

<button onclick="addRow()">➕ Add Row</button>

<table id="table">
  <tr>
    <th>Sl No</th>
    <th>Date</th>
    <th>Tag</th>
    <th>Location</th>
    <th>Status</th>
    <th>Remarks</th>
    <th>Shift</th>
  </tr>
</table>

<!-- FIREBASE v8 -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>

// 🔥 YOUR CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyCIbZZvMeMxO2kbHCkWunMIfDRgCz_OngE",
  authDomain: "fire-safety-app-5b93f.firebaseapp.com",
  projectId: "fire-safety-app-5b93f",
  storageBucket: "fire-safety-app-5b93f.firebasestorage.app",
  messagingSenderId: "641973984641",
  appId: "1:641973984641:web:3829c7001573357c4a1c80"
};

// INIT
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// GET DATA
let mall = localStorage.getItem("mall");
let system = localStorage.getItem("system");

document.getElementById("title").innerText =
  "🔥 " + mall + " - " + system;

// ADD ROW
function addRow() {
  db.collection("records").add({
    mall: mall,
    system: system,
    date: new Date().toISOString().split('T')[0],
    tag: "Test Tag",
    location: "Test Location",
    status: "OK",
    remarks: "Working",
    shift: "Day"
  })
  .then(() => {
    alert("Data Saved!");
  })
  .catch((error) => {
    alert("Error: " + error);
  });
}

// LOAD DATA
db.collection("records")
  .where("mall", "==", mall)
  .where("system", "==", system)
  .onSnapshot((snapshot) => {

    let table = document.getElementById("table");

    table.innerHTML = `
      <tr>
        <th>Sl No</th>
        <th>Date</th>
        <th>Tag</th>
        <th>Location</th>
        <th>Status</th>
        <th>Remarks</th>
        <th>Shift</th>
      </tr>
    `;

    let i = 1;

    snapshot.forEach(doc => {
      let d = doc.data();

      let row = table.insertRow();

      row.innerHTML = `
        <td>${i++}</td>
        <td>${d.date}</td>
        <td>${d.tag}</td>
        <td>${d.location}</td>
        <td>${d.status}</td>
        <td>${d.remarks}</td>
        <td>${d.shift}</td>
      `;
    });

  });

</script>

</body>
</html>
