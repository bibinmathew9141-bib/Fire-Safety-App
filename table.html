<!DOCTYPE html>
<html>
<head>
<title>Tamdeen System</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
margin:0;
font-family:Arial;
background:#0b0f14;
color:white;
}

.header{
text-align:center;
padding:10px;
background:#111827;
color:#ff4d4d;
font-weight:bold;
}

.btns{
text-align:center;
margin:10px;
}

button{
padding:8px 12px;
margin:4px;
border:none;
border-radius:6px;
cursor:pointer;
background:#1f2937;
color:white;
}

button:hover{
background:#374151;
}

table{
width:100%;
border-collapse:collapse;
margin-top:10px;
}

th,td{
border:1px solid #333;
padding:6px;
text-align:center;
font-size:13px;
}

th{
background:#1f2937;
}

input{
width:90%;
font-size:12px;
}
</style>
</head>

<body onload="init()">

<div class="header" id="title"></div>

<div class="btns">
<button onclick="setMode('daily')">Daily</button>
<button onclick="setMode('monthly')">Monthly</button>
<button onclick="setMode('yearly')">Yearly</button>
</div>

<div class="btns">
<button onclick="addRow()" id="addBtn">+ Add Row</button>
<button onclick="exportCSV()">Excel</button>
<button onclick="window.print()">PDF</button>
</div>

<table id="table"></table>

<script src="script.js"></script>

</body>
</html>
