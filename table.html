<!DOCTYPE html>
<html>
<head>
<title>Data</title>
<link rel="stylesheet" href="style.css">
</head>

<body class="main-body" onload="initPage()">

<h2 class="title">
🔥 Tamdeen Group <br>
🏢 <span id="mallHeader"></span>
</h2>

<div class="filter-box" id="dynamicFilters"></div>

<div class="filter-box">
<button onclick="goBack()">⬅ Back</button>
<button onclick="goHome()">🏠 Home</button>
</div>

<div class="filter-box">
<button onclick="addRow()">➕ Add Row</button>
<button onclick="exportExcel()">📊 Save Excel</button>
<button onclick="printPDF()">🖨 PDF</button>
<button onclick="openHelp()">❓ Help</button>
</div>

<div class="table-container">

<table id="dataTable">

<tr>
<th>Sl</th>
<th>Date<br><input onkeyup="colFilter(1,this.value)"></th>
<th>Tag<br><input onkeyup="colFilter(2,this.value)"></th>
<th>Location<br><input onkeyup="colFilter(3,this.value)"></th>
<th>Status<br><input onkeyup="colFilter(4,this.value)"></th>
<th>Remarks<br><input onkeyup="colFilter(5,this.value)"></th>
<th>Shift<br><input onkeyup="colFilter(6,this.value)"></th>
<th>Action</th>
</tr>

</table>

</div>

<script src="script.js"></script>
</body>
</html>
