<!DOCTYPE html>
<html>
<head>
    <title>Data Table</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="main-body" onload="initPage()">

<h2 class="title" id="mallTitle"></h2>

<div class="filter-box" id="dynamicFilters"></div>

<div class="filter-box">
    <button onclick="printPDF()">Print PDF</button>
    <button onclick="addRow()">Add Row</button>
    <button onclick="openHelp()">Help</button>
</div>

<div class="table-container">
<table id="dataTable">

<tr>
    <th>Sl No</th>
    <th>Date<br><input onkeyup="columnFilter(1,this.value)"></th>
    <th>Tag<br><input onkeyup="columnFilter(2,this.value)"></th>
    <th>Location<br><input onkeyup="columnFilter(3,this.value)"></th>
    <th>Status<br><input onkeyup="columnFilter(4,this.value)"></th>
    <th>Remarks<br><input onkeyup="columnFilter(5,this.value)"></th>
    <th>Shift<br><input onkeyup="columnFilter(6,this.value)"></th>
</tr>

</table>
</div>

<script src="script.js"></script>
</body>
</html>
